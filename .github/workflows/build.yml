name: build

# PyInstaller cannot cross-compile, so each native deliverable is produced on
# its own runner: Haven.exe on Windows, Haven.app on Apple Silicon macOS.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pygame>=2.5,<3" PyOpenGL
          # Optional compiled speedup — a missing wheel must not fail the job.
          python -m pip install PyOpenGL-accelerate || echo "accelerate unavailable"
      - name: Headless smoke tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_smoke.py

  windows:
    name: Haven.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pygame>=2.5,<3" PyOpenGL pyinstaller pillow
          python -m pip install PyOpenGL-accelerate || echo "accelerate unavailable"
      # WiX ships on the runner image but is not on PATH; adding it lets
      # build_windows.py emit the optional Haven.msi as well.
      - name: Put WiX on PATH (enables the optional .msi)
        run: |
          $wix = Get-ChildItem "C:/Program Files (x86)" -Filter "WiX Toolset*" `
                 -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) {
            "$($wix.FullName)/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            Write-Host "WiX: $($wix.FullName)"
          } else {
            Write-Host "WiX not present; the .msi step will be skipped"
          }
        shell: pwsh
      - name: Build
        run: python scripts/build_windows.py
      # Run the packaged binary itself, not the source tree: this is what
      # proves the bundle works on a machine with no dev runtime installed.
      - name: Verify Haven.exe runs standalone
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          HAVEN_SELFTEST: "1"
        run: |
          if (-not (Test-Path dist/Windows/Haven.exe)) { throw "Haven.exe missing" }
          & dist/Windows/Haven.exe
          if ($LASTEXITCODE -ne 0) { throw "selftest failed ($LASTEXITCODE)" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Windows
          path: |
            dist/Windows/Haven.exe
            dist/Windows/Haven-Windows.zip
            dist/Windows/Haven.msi
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Haven.app
    needs: test
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pygame>=2.5,<3" PyOpenGL pyinstaller pillow
          python -m pip install PyOpenGL-accelerate || echo "accelerate unavailable"
      - name: Build
        run: python scripts/build_macos.py
      # Run the bundled executable itself, proving the .app works without a
      # dev runtime. Also confirms it is a native arm64 binary.
      - name: Verify Haven.app runs standalone
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          HAVEN_SELFTEST: "1"
        run: |
          test -d dist/macOS/Haven.app || { echo "Haven.app missing"; exit 1; }
          BIN="dist/macOS/Haven.app/Contents/MacOS/Haven"
          test -x "$BIN" || { echo "bundle executable missing"; exit 1; }
          file "$BIN"
          lipo -archs "$BIN" || true
          "$BIN"
      - name: Regenerate the self-contained installer
        run: python scripts/make_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-macOS
          path: |
            dist/macOS/Haven.app
            dist/macOS/Haven-macOS.zip
            dist/macOS/Haven.dmg
            dist/shelter.sh
          if-no-files-found: error
          retention-days: 30
